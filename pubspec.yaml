name: nabd_clock
description: "تطبيق منبه نبض كلوك مع نغمات تنبيه حقيقية واختيار النغمات من الهاتف"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  file_picker: ^10.1.2
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  intl: ^0.20.0
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  wakelock_plus: ^1.3.1
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/